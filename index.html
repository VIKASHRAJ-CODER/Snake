<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1713">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Snake — Fullscreen mobile game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1713;
      --panel: #13231d;
      --line: #264238;
      --ink: #edfff4;
      --muted: #91ad9d;
      --accent: #b6f36b;
      --board: #c4d6aa;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0; color: var(--ink); background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; color: inherit; touch-action: manipulation; user-select: none; }
    .game-shell {
      width: 100%; height: 100vh; height: 100dvh; display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; padding:
        max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: radial-gradient(ellipse at 50% 45%, #152b20, var(--bg) 72%);
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .3px; }
    .brand-icon { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #3c5a40; border-radius: 11px; color: var(--accent); background: #203829; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .8px; }
    .hud { display: flex; align-items: center; gap: 8px; }
    .score-box { min-width: 77px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: #101f19; text-align: right; }
    .score-box span { display: block; color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .score-box strong { font-size: 16px; font-variant-numeric: tabular-nums; }
    .tool-button { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: var(--panel); font-size: 16px; }
    .tool-button:active { color: var(--accent); border-color: #57754a; }
    .stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 10px 0; }
    .board-wrap { position: relative; display: grid; place-items: center; max-width: 100%; max-height: 100%; }
    #game {
      display: block; width: min(94vw, 620px, calc((100dvh - 210px) * 1.4286));
      height: auto; max-height: 100%; aspect-ratio: 20 / 14; border: 2px solid #5c7550;
      border-radius: 8px; background: var(--board); box-shadow: 0 0 0 7px #12251b, 0 18px 55px #0007;
      image-rendering: pixelated; touch-action: none;
    }
    .screen-message { position: absolute; inset: 0; display: grid; place-content: center; gap: 9px; padding: 18px; color: #efffdd; border-radius: 8px; background: #07140fce; text-align: center; backdrop-filter: blur(2px); }
    .screen-message[hidden] { display: none; }
    .screen-message strong { font-size: clamp(22px, 6vw, 36px); font-weight: 950; letter-spacing: 2px; }
    .screen-message span { color: #c4d6aa; font-size: 12px; font-weight: 700; }
    .bottom { display: flex; align-items: end; justify-content: center; gap: clamp(18px, 8vw, 70px); padding-top: 4px; }
    .controls-copy { align-self: center; max-width: 190px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .controls-copy strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 12px; }
    .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 45px); gap: 7px; }
    .dpad button { border: 1px solid #334d3c; border-radius: 13px; color: #e5f5df; background: linear-gradient(#20372a, #15271e); font-size: 19px; font-weight: 900; }
    .dpad button:active { color: var(--accent); background: #2a4730; transform: scale(.96); }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .center { grid-column: 2; grid-row: 2; color: var(--accent); font-size: 12px; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .dpad { grid-template-rows: repeat(3, 42px); }
    .hint { margin-top: 8px; color: #678173; font-size: 9px; text-align: center; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 600px) {
      .game-shell { grid-template-rows: auto minmax(0, 1fr) auto; }
      .brand-icon { width: 30px; height: 30px; }
      .score-box { min-width: 65px; padding: 5px 7px; }
      .tool-button { width: 34px; height: 34px; }
      .bottom { gap: 16px; }
      .controls-copy { max-width: 120px; font-size: 10px; }
      .dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 38px); gap: 5px; }
      .dpad button { border-radius: 11px; }
      #game { width: min(94vw, calc((100dvh - 190px) * 1.4286)); }
    }
    @media (orientation: portrait) {
      #game { width: min(94vw, 470px, calc((100dvh - 190px) * .7)); aspect-ratio: 14 / 20; }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      .game-shell { grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; column-gap: 18px; }
      .topbar { grid-column: 1 / -1; }
      .stage { grid-column: 1; grid-row: 2; }
      .bottom { grid-column: 2; grid-row: 2; flex-direction: column-reverse; gap: 5px; align-items: center; padding: 0 4px; }
      .controls-copy { display: none; }
      #game { width: min(66vw, calc((100dvh - 98px) * 1.4286)); }
      .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 34px); gap: 4px; }
    }
    @media (display-mode: fullscreen) { .tool-button[data-fullscreen] { color: var(--accent); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">◈</span><div>SNAKE<small>ARCADE EDITION</small></div></div>
      <div class="hud">
        <div class="score-box"><span>Score</span><strong id="scoreLabel">0</strong></div>
        <div class="score-box"><span>Best</span><strong id="bestLabel">0</strong></div>
        <button id="restartButton" class="tool-button" type="button" aria-label="Restart game" title="Restart">↻</button>
        <button id="fullscreenButton" class="tool-button" data-fullscreen type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
      </div>
    </header>
    <section class="stage" aria-label="Snake game">
      <div class="board-wrap">
        <canvas id="game" width="600" height="420" aria-label="Snake game board"></canvas>
        <div id="screenMessage" class="screen-message"><strong>SNAKE</strong><span>TAP TO PLAY</span></div>
      </div>
    </section>
    <footer class="bottom">
      <div class="controls-copy"><strong>How to play</strong>Swipe the board or use the pad to steer. Eat the glowing fruit and avoid the walls.</div>
      <div>
        <div class="dpad" aria-label="Touch controls">
          <button class="up" type="button" data-direction="up" aria-label="Move up">▲</button>
          <button class="left" type="button" data-direction="left" aria-label="Move left">◀</button>
          <button class="center" id="pauseButton" type="button" aria-label="Start or pause">Ⅱ</button>
          <button class="right" type="button" data-direction="right" aria-label="Move right">▶</button>
          <button class="down" type="button" data-direction="down" aria-label="Move down">▼</button>
        </div>
        <div class="hint">SWIPE · D-PAD · ARROW KEYS</div>
      </div>
    </footer>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });
      let cols = 20;
      let rows = 14;
      const cell = 30;
      const boardColor = "#c4d6aa";
      const snakeColor = "#244b34";
      const headColor = "#142f24";
      const message = document.getElementById("screenMessage");
      const scoreLabel = document.getElementById("scoreLabel");
      const bestLabel = document.getElementById("bestLabel");
      let snake, food, direction, nextDirection, score, highScore, timer, state;

      function sizeBoard() {
        const portrait = window.matchMedia("(orientation: portrait)").matches;
        const nextCols = portrait ? 14 : 20;
        const nextRows = portrait ? 20 : 14;
        if (nextCols === cols && nextRows === rows) return;
        const length = snake ? snake.length : 3;
        cols = nextCols;
        rows = nextRows;
        canvas.width = cols * cell;
        canvas.height = rows * cell;
        if (snake) {
          const head = { x: Math.floor(cols / 2), y: Math.floor(rows / 2) };
          const maxLength = direction.x ? cols - 2 : rows - 2;
          snake = Array.from({ length: Math.min(length, maxLength) }, (_, index) => ({
            x: head.x - direction.x * index,
            y: head.y - direction.y * index
          }));
          placeFood();
          draw();
        }
      }

      try { highScore = Number(localStorage.getItem("snake-high-score")) || 0; }
      catch { highScore = 0; }

      function freshGame() {
        snake = [{ x: 5, y: 7 }, { x: 4, y: 7 }, { x: 3, y: 7 }];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        scoreLabel.textContent = score;
        bestLabel.textContent = highScore;
        placeFood();
        draw();
      }

      function placeFood() {
        do {
          food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
        } while (snake.some(part => part.x === food.x && part.y === food.y));
      }

      function draw() {
        ctx.fillStyle = boardColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#90a57c";
        ctx.lineWidth = 1;
        for (let x = 0; x <= cols; x++) {
          ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, canvas.height); ctx.stroke();
        }
        for (let y = 0; y <= rows; y++) {
          ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(canvas.width, y * cell + .5); ctx.stroke();
        }
        ctx.fillStyle = "#31572d";
        ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e7f09c";
        ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2 - 2, food.y * cell + cell / 2 - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? headColor : snakeColor;
          ctx.beginPath();
          ctx.roundRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4, 7);
          ctx.fill();
          if (index === 0) {
            ctx.fillStyle = boardColor;
            const eyeX = direction.x === 1 ? 21 : direction.x === -1 ? 8 : 10;
            const eyeY = direction.y === 1 ? 21 : direction.y === -1 ? 8 : 10;
            ctx.fillRect(part.x * cell + eyeX, part.y * cell + eyeY, 3, 3);
            ctx.fillRect(part.x * cell + (direction.x === 1 ? 21 : direction.x === -1 ? 8 : 20), part.y * cell + (direction.y === 1 ? 21 : direction.y === -1 ? 8 : 20), 3, 3);
          }
        });
      }

      function setMessage(title, subtitle) {
        message.innerHTML = `<strong>${title}</strong><span>${subtitle}</span>`;
        message.hidden = false;
      }

      function start() {
        clearInterval(timer);
        freshGame();
        state = "playing";
        message.hidden = true;
        timer = setInterval(tick, 135);
      }

      function pause() {
        if (state === "playing") {
          clearInterval(timer);
          state = "paused";
          setMessage("PAUSED", "PRESS 5 TO CONTINUE");
        } else if (state === "paused") {
          state = "playing";
          message.hidden = true;
          timer = setInterval(tick, 135);
        } else {
          start();
        }
      }

      function endGame() {
        clearInterval(timer);
        state = "over";
        if (score > highScore) {
          highScore = score;
          try { localStorage.setItem("snake-high-score", String(highScore)); } catch {}
        }
        scoreLabel.textContent = score;
        bestLabel.textContent = highScore;
        setMessage("GAME OVER", "TAP OR PRESS SPACE TO PLAY AGAIN");
      }

      function tick() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
            body.some(part => part.x === head.x && part.y === head.y)) {
          endGame();
          return;
        }
        snake.unshift(head);
        if (eating) {
          score += 10;
          if (score > highScore) {
            highScore = score;
            try { localStorage.setItem("snake-high-score", String(highScore)); } catch {}
          }
          scoreLabel.textContent = score;
          bestLabel.textContent = highScore;
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function turn(x, y) {
        if (state !== "playing") {
          if (state === "ready" || state === "over") start();
          else return;
        }
        if (x !== -nextDirection.x || y !== -nextDirection.y) nextDirection = { x, y };
      }

      function handleKey(key) {
        const normalized = key.toLowerCase();
        if (["enter", " "].includes(normalized)) { pause(); return; }
        const directions = {
          "2": [0, -1], arrowup: [0, -1], w: [0, -1],
          "4": [-1, 0], arrowleft: [-1, 0], a: [-1, 0],
          "6": [1, 0], arrowright: [1, 0], d: [1, 0],
          "8": [0, 1], arrowdown: [0, 1], s: [0, 1]
        };
        if (directions[normalized]) turn(...directions[normalized]);
      }

      document.addEventListener("keydown", event => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
        handleKey(event.key);
      });
      document.querySelectorAll("[data-direction]").forEach(button => button.addEventListener("pointerdown", event => {
        event.preventDefault();
        const vectors = { up: [0, -1], left: [-1, 0], right: [1, 0], down: [0, 1] };
        turn(...vectors[button.dataset.direction]);
      }));
      document.getElementById("pauseButton").addEventListener("click", pause);
      document.getElementById("restartButton").addEventListener("click", start);
      document.getElementById("fullscreenButton").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else { setMessage("FULLSCREEN UNAVAILABLE", "TRY ADDING THIS PAGE TO HOME SCREEN"); return; }
        } catch {
          setMessage("FULLSCREEN BLOCKED", "TAP THE BROWSER MENU TO EXPAND");
        }
      });
      document.addEventListener("fullscreenchange", () => {
        document.getElementById("fullscreenButton").setAttribute(
          "aria-label", document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen"
        );
      });
      let touchStartX = 0;
      let touchStartY = 0;
      canvas.addEventListener("pointerdown", event => {
        touchStartX = event.clientX;
        touchStartY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointerup", event => {
        const dx = event.clientX - touchStartX;
        const dy = event.clientY - touchStartY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) {
          if (state !== "playing") pause();
          return;
        }
        if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
        else turn(0, dy > 0 ? 1 : -1);
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") pause();
      });
      window.addEventListener("resize", sizeBoard);
      window.matchMedia("(orientation: portrait)").addEventListener?.("change", sizeBoard);

      sizeBoard();
      freshGame();
      state = "ready";
      bestLabel.textContent = highScore;
      setMessage("SNAKE", "TAP TO PLAY");
    })();
  </script>
</body>
</html>
